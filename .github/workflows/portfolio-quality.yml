name: Portfolio quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install linter
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

  test-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit, SQL fixture, and integration tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild with deterministic demo data
        run: python python/run_pipeline.py --generate-demo-data

      - name: Confirm the rebuilt model passes every critical check
        run: |
          python - <<'PY'
          import duckdb
          from pathlib import Path

          sql = Path("sql/07_validate_model.sql").read_text(encoding="utf-8")
          connection = duckdb.connect("database/logistics.duckdb", read_only=True)
          results = connection.execute(sql).fetchall()
          failures = [row[0] for row in results if row[3] != "PASS"]

          print(f"{len(results)} validation tests, {len(failures)} failing")
          if failures:
              raise SystemExit("FAILED: " + ", ".join(failures))
          PY
