[project]
name = "logistics-control-tower"
version = "1.0.0"
description = "End-to-end logistics analytics case study: DuckDB star schema, reproducible Python pipeline, and a Power BI semantic-model kit."
requires-python = ">=3.13"
readme = "README.md"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv", "data", "database", "reports"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "E402", # imports must follow the module docstring
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib over os.path
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["pipeline_config", "pipeline_utils", "sql_fixtures"]
